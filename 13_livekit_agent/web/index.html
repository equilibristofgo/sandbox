<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Web 3D Avatar - LiveKit</title>
    <!-- Three.js & LiveKit Client SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --card-bg: rgba(16, 24, 40, 0.75);
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Soporte para OBS Browser Source transparente (?transparent=true) */
        body.transparent {
            background-color: transparent !important;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(8px);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px var(--accent-glow);
            width: fit-content;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .status-dot.speaking {
            background-color: #00ff66;
            box-shadow: 0 0 14px #00ff66;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.4); opacity: 1; }
        }

        #control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s;
        }

        #control-panel input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        #control-panel input:focus {
            border-color: var(--accent-cyan);
        }

        #control-panel button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            padding: 9px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        #control-panel button:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .hide-controls #control-panel {
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud">
        <div class="badge">
            <div id="status-indicator" class="status-dot"></div>
            <span id="status-text">DESCONECTADO</span>
        </div>
    </div>

    <div id="control-panel">
        <span style="font-size: 12px; font-weight: 600; color: var(--accent-cyan); letter-spacing: 1px;">JARVIS 3D AVATAR CONFIG</span>
        <input type="text" id="livekit-url" placeholder="ws://localhost:7880" value="ws://localhost:7880">
        <input type="text" id="livekit-token" placeholder="LiveKit Token">
        <button id="btn-connect">Conectar a Sala</button>
        <span style="font-size: 10px; opacity: 0.6; text-align: center;">Tip: usa ?url=...&token=... para OBS Browser Source</span>
    </div>

    <script>
        // --- 1. SETUP DE PARÁMETROS URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const autoUrl = urlParams.get('url');
        const autoToken = urlParams.get('token');
        const isTransparent = urlParams.get('transparent') === 'true';

        if (isTransparent) {
            document.body.classList.add('transparent');
        }

        if (autoUrl && autoToken) {
            document.body.classList.add('hide-controls');
        }

        // --- 2. CONFIGURACIÓN DE THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Geometría del Orbe Holográfico Reactivo
        const sphereGeo = new THREE.IcosahedronGeometry(1.6, 5);
        const originalPositions = sphereGeo.attributes.position.clone();

        const sphereMat = new THREE.MeshStandardMaterial({
            color: 0x0077ff,
            emissive: 0x00d4ff,
            emissiveIntensity: 0.5,
            wireframe: true,
            roughness: 0.2,
            metalness: 0.8,
            transparent: true,
            opacity: 0.85
        });
        const orb = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(orb);

        // Núcleo brillante interior
        const coreGeo = new THREE.SphereGeometry(0.7, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.95
        });
        const innerCore = new THREE.Mesh(coreGeo, coreMat);
        scene.add(innerCore);

        // Anillo orbital giroscópico
        const ringGeo = new THREE.TorusGeometry(2.3, 0.03, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        scene.add(ring);

        // Nube de partículas circundantes
        const particlesCount = 200;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
            pPos[i] = (Math.random() - 0.5) * 8;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ size: 0.04, color: 0x00ffff, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00ffff, 2, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // --- 3. GESTIÓN DE AUDIO Y WEBRTC ---
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let audioLevel = 0;

        function setupAudioAnalysis(mediaStream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            const source = audioCtx.createMediaStreamSource(mediaStream);
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            console.log("AudioContext conectado al track de voz de Jarvis.");
        }

        // --- 4. BUCLE DE ANIMACIÓN ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Medir audio si está disponible
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                audioLevel = (sum / dataArray.length) / 255.0; // 0.0 a 1.0
            } else {
                audioLevel = 0;
            }

            // Actualizar indicador UI
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            if (audioLevel > 0.08) {
                indicator.className = 'status-dot speaking';
                statusText.innerText = 'JARVIS HABLANDO';
            } else if (room && room.state === 'connected') {
                indicator.className = 'status-dot active';
                statusText.innerText = 'JARVIS ESCUCHANDO';
            }

            // Deformación de vértices por audio
            const positions = orb.geometry.attributes.position;
            const orig = originalPositions;
            const baseScale = 1.0 + (audioLevel * 0.5);

            for (let i = 0; i < positions.count; i++) {
                const ox = orig.getX(i);
                const oy = orig.getY(i);
                const oz = orig.getZ(i);

                // Ruido sinusoidal suave + frecuencia de audio
                const wave = Math.sin(ox * 2 + time * 3) * Math.cos(oy * 2 + time * 3) * (0.08 + audioLevel * 0.45);
                positions.setXYZ(i, ox * baseScale + wave, oy * baseScale + wave, oz * baseScale + wave);
            }
            positions.needsUpdate = true;

            // Rotaciones del orbe y anillos
            orb.rotation.y = time * 0.4;
            orb.rotation.x = time * 0.2;
            ring.rotation.z = time * 0.8;
            ring.rotation.y = time * 0.5;
            particles.rotation.y = time * 0.05;

            // Pulso del núcleo interior
            const coreScale = 0.7 + Math.sin(time * 3) * 0.05 + audioLevel * 0.4;
            innerCore.scale.set(coreScale, coreScale, coreScale);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 5. CONEXIÓN A LIVEKIT ---
        let room = null;

        async function connectToLiveKit(url, token) {
            const statusText = document.getElementById('status-text');
            statusText.innerText = 'CONECTANDO...';

            room = new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true,
            });

            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                console.log(`Pista suscrita: ${track.kind} de ${participant.identity}`);
                if (track.kind === LivekitClient.Track.Kind.Audio) {
                    const audioElement = track.attach();
                    document.body.appendChild(audioElement);
                    audioElement.style.display = 'none';

                    const mediaStream = new MediaStream([track.mediaStreamTrack]);
                    setupAudioAnalysis(mediaStream);
                }
            });

            room.on(LivekitClient.RoomEvent.Disconnected, () => {
                document.getElementById('status-indicator').className = 'status-dot';
                statusText.innerText = 'DESCONECTADO';
            });

            try {
                await room.connect(url, token);
                statusText.innerText = 'JARVIS ESCUCHANDO';
                document.getElementById('status-indicator').className = 'status-dot active';
                console.log('Conectado a LiveKit con éxito.');
            } catch (err) {
                console.error('Error conectando a LiveKit:', err);
                statusText.innerText = 'ERROR CONEXIÓN';
            }
        }

        document.getElementById('btn-connect').addEventListener('click', () => {
            const url = document.getElementById('livekit-url').value;
            const token = document.getElementById('livekit-token').value;
            if (url && token) {
                connectToLiveKit(url, token);
            } else {
                alert('Introduce la URL y el Token de LiveKit');
            }
        });

        // Autoconectar si vienen por URL
        if (autoUrl && autoToken) {
            connectToLiveKit(autoUrl, autoToken);
        }
    </script>
</body>
</html>
